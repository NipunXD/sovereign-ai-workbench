[project]
name = "workbench"
version = "0.1.0"
description = "Sovereign On-Premise Agentic AI Workbench — API"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    "httpx>=0.27",

    # --- config / models ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",

    # --- persistence ---
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",

    # --- security ---
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",

    # --- observability ---
    "structlog>=24.4",
    "python-ulid>=3.0",

    # --- queue ---
    "arq>=0.26",
    "redis>=5.2",

    # --- rag ---
    # Pinned to the same minor as the server image in docker-compose.yml.
    # The client refuses a minor-version gap wider than one, and matching
    # them keeps the air-gap bundle from carrying two Qdrant versions.
    "qdrant-client>=1.12,<1.13",
    "numpy>=2.1",

    # --- ingestion ---
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "rapidocr-onnxruntime>=1.4",
    "duckdb>=1.1",

    # --- agent ---
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",

    # --- artifacts / calculations ---
    "matplotlib>=3.9",
    "reportlab>=4.2",
    "pint>=0.24",

    # --- sandbox ---
    "docker>=7.1",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "anyio>=4.6",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-pyyaml",
    "respx>=0.21",
    "faker>=30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]
