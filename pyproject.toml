[project]
name = "workbench-monorepo"
version = "0.1.0"
description = "Sovereign On-Premise Agentic AI Workbench — SIH 2026 PS 26117 (MRPL), Team AIDUO"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "evals"]

[tool.uv]
package = false

[tool.uv.sources]
workbench = { workspace = true }

# ----------------------------------------------------------------------------
# Lint / format / types — shared across every workspace member
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src", "evals"]
extend-exclude = ["apps/api/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "TID",       # tidy imports
    "PTH",       # use pathlib
    "RUF",       # ruff-specific
    "ASYNC",     # async correctness
    "S",         # bandit (security)
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI Depends() in defaults is the framework idiom
    "S101",    # assert is fine in tests
]
# Engineering notation, not homoglyph smuggling: ρ for density, × for vessel
# dimensions, − as a typographic minus in measured values. Spelling these as
# ASCII would make the domain text wrong to read.
allowed-confusables = ["×", "−", "ρ", "›"]  # › separates section-path levels

[tool.ruff.lint.per-file-ignores]
# ASYNC240: blocking pathlib in an async *test* is not a served-request
# latency concern, which is what the rule exists to catch.
"apps/api/tests/**" = ["S", "N806", "ASYNC240"]
"evals/**" = ["S"]
"services/sandbox/**" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["workbench", "evals"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_reexport = true
exclude = ["apps/api/migrations/versions/", "\\.venv/"]

[[tool.mypy.overrides]]
module = [
    "qdrant_client.*", "faiss.*", "rapidocr_onnxruntime.*", "cv2.*",
    "docker.*", "pptx.*", "docx.*", "openpyxl.*", "pymupdf.*", "pint.*",
    "sentence_transformers.*", "arq.*", "langgraph.*", "matplotlib.*",
    "duckdb.*", "reportlab.*", "pytesseract.*", "pandas.*", "fitz.*",
]
ignore_missing_imports = true

# PyMuPDF and python-pptx ship a py.typed marker but leave their own
# functions unannotated, so every call into them is reported. Our code is
# still checked — disallow_untyped_defs means this code can only ever fire
# on calls into those libraries.
[[tool.mypy.overrides]]
module = ["workbench.ingest.extractors.pdf", "workbench.artifacts.pptx_builder"]
disable_error_code = ["no-untyped-call"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
# Fixtures and the tests that use them must share one event loop; a
# client created on one loop cannot be awaited on another.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["apps/api/tests", "tests"]
# The repo root too, so the eval harness (evals/) imports without a
# PYTHONPATH set by hand — tests/evals covers its metrics.
pythonpath = ["apps/api/src", "."]
addopts = "-q --strict-markers --strict-config"
markers = [
    "docker: requires a working Docker daemon",
    "ollama: requires a running Ollama with the model manifest pulled",
    "qdrant: requires a running Qdrant instance",
    "integration: exercises real infrastructure rather than fakes",
    "slow: takes more than a few seconds",
    "e2e: full-stack end-to-end test",
]
filterwarnings = ["error", "ignore::DeprecationWarning:passlib.*"]

[tool.coverage.run]
source = ["apps/api/src/workbench"]
omit = ["*/migrations/*", "*/tests/*"]

# ----------------------------------------------------------------------------
# Module boundary enforcement (see docs/01-architecture.md)
# api -> agent -> tools -> {rag,ingest,artifacts,sandbox,providers} -> db/core
# ----------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["workbench"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "workbench.api",
    "workbench.agent",
    "workbench.tools",
    # Ingestion sits *above* retrieval, because that is the real relationship:
    # the indexer's job is to write chunks into the vector store, so it depends
    # on the embedder and the store. Listing them as siblings said they were
    # independent, which they never were — and the violation it produced was
    # unfixable without inverting a dependency that points the right way.
    # The reverse direction is now genuinely absent: the shared document types
    # moved to workbench.core.ir, which is what freed retrieval from ingestion.
    "workbench.ingest",
    "workbench.rag | workbench.artifacts | workbench.sandbox | workbench.router",
    "workbench.providers",
    "workbench.security",
    "workbench.db",
    "workbench.core",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Workers may not be imported by the request path"
type = "forbidden"
source_modules = ["workbench.api", "workbench.agent", "workbench.rag", "workbench.ingest"]
forbidden_modules = ["workbench.workers"]
